name: Regenerate Snapshot References

# Re-records every snapshot reference on the CI runner — the source of truth — and opens a PR with
# the result. Use it whenever references need updating: after a deliberate rendering change, or when
# GitHub bumps the runner's macOS (the Snapshot Environment check will have warned). It exists
# because references are bound to the recording environment (Xcode + macOS), so a contributor whose
# local macOS differs from CI's cannot produce matching references locally — they trigger this
# instead and review the PR.
#
# Run it from the Actions tab (or `gh workflow run`) on the branch you want the references for; the
# PR is opened against that branch. Requires "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General).

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate on CI and open a PR
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load snapshot config
        uses: ./.github/actions/snapshot-config

      - name: Select Xcode version (${{ env.SNAPSHOT_XCODE }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.SNAPSHOT_XCODE }}

      - name: Disable prebuilts
        run: defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO

      # Each suite: clear its references, run once to record them, run again to prove the recording
      # verifies. The second run has no `|| true`, so a suite that cannot reproduce its own output
      # fails the job and no PR is opened.
      - name: Record every suite on this runner
        run: |
          set -e
          record() {
            local scheme="$1" destination="$2"; shift 2
            rm -rf "$@"
            xcodebuild test -scheme "$scheme" -destination "$destination" || true
            xcodebuild test -scheme "$scheme" -destination "$destination"
          }
          record SnapshotsUnitTests 'platform=macOS' \
            Tests/SnapshotsUnitTests/ExpectSnapshot/__Snapshots__
          record SnapshotsIntegrationTests "$IOS_SIM_DESTINATION" \
            Tests/SnapshotsIntegrationTests/ExpectSnapshot/__Snapshots__
          record SnapshotsIntegrationRepetitionTests "$IOS_SIM_DESTINATION" \
            Tests/SnapshotsIntegrationRepetitionTests/__Snapshots__

      # The references were just recorded on this runner's macOS, so the marker must track it —
      # otherwise the Snapshot Environment check would immediately warn about the refs it just made.
      - name: Update the recorded-on macOS marker
        run: |
          macos=$(sw_vers -productVersion | cut -d. -f1,2)
          sed -i '' "s/^SNAPSHOT_MACOS = .*/SNAPSHOT_MACOS = \"$macos\"/" mise.toml
          echo "recorded on macOS $macos"

      - name: Open a pull request with the regenerated references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "References already match this environment — nothing to regenerate."
            exit 0
          fi
          branch="regenerate-snapshots-${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "Regenerate snapshot references on CI (Xcode $SNAPSHOT_XCODE)"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Regenerate snapshot references on CI" \
            --body "Re-recorded on the CI runner — the environment that verifies them — so they are correct regardless of any contributor's local macOS. Xcode \`$SNAPSHOT_XCODE\`; \`SNAPSHOT_MACOS\` in mise.toml updated to the runner's macOS. Recorded and re-verified before this PR was opened; merging runs the full suite against them."
