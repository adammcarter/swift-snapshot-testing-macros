name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per ref matters; a new push cancels the previous run in
# progress so the queue never backs up behind superseded commits.
concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Format and Lint
    runs-on: macos-26
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run lint
        run: mise run lint
    
  swift-build-matrix:
    name: Swift Test Matrix (${{ matrix.xcode }})
    needs: [format-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        xcode: ['16.3', '16.4', '26.0', '26.1', '26.2', '26.3']
        os: [macos-15]
        include:
          - xcode: '26.4'
            os: macos-26
          - xcode: '26.5'
            os: macos-26

    steps:
      - name: Select Xcode version (${{ matrix.xcode }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run focused unit suites
        run: |
          swift test --filter ExpectSnapshotAdapterTests
          swift test --filter ExpectSnapshotMacroTests
          swift test --filter SnapshotSuiteTests
          swift test --filter SnapshotTestTests
    
  ios-integration-tests:
    name: Integration Tests (${{ matrix.xcode }})
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.3', '26.5']

    steps:
      - name: Select Xcode version (${{ matrix.xcode }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Disable prebuilts
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          defaults read com.apple.dt.Xcode IDEPackageEnablePrebuilts

      - name: List available simulator runtimes
        run: xcrun simctl list runtimes

      - name: Run SnapshotsIntegrationTests (iOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsIntegrationTests \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2,arch=arm64"
    
  ios-integration-repetition-tests:
    name: Integration Repetition Tests
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26

    steps:
      - name: Select Xcode version (26.3)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Disable prebuilts
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          defaults read com.apple.dt.Xcode IDEPackageEnablePrebuilts

      - name: Run SnapshotsIntegrationRepetitionTests (iOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsIntegrationRepetitionTests \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2,arch=arm64"

  macos-unit-tests:
    name: Unit Tests
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26

    steps:
      - name: Select Xcode version (26.3)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Run SnapshotsUnitTests (macOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsUnitTests \
            -destination 'platform=macOS'

  native-consumer-build-checks:
    name: Native Consumer Build Checks (${{ matrix.xcode }} / ${{ matrix.scheme }} / ${{ matrix.platform.name }})
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.4', '26.5']
        scheme: ['SnapshotsUnitTests', 'SnapshotsIntegrationTests']
        # Both platforms, in parallel. macOS alone compiles out everything behind
        # `#if canImport(UIKit)`, so an iOS-only break passes it unnoticed; iOS alone
        # never exercises the AppKit rendering path. Neither is a substitute.
        platform:
          - name: macOS
            destination: 'platform=macOS'
          - name: iOS
            destination: 'platform=iOS Simulator,name=iPhone 17,OS=26.2,arch=arm64'

    steps:
      - name: Select Xcode version (${{ matrix.xcode }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run native consumer build check (${{ matrix.platform.name }})
        run: |
          xcodebuild build-for-testing \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.platform.destination }}'
