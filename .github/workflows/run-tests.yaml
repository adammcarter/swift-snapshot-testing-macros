name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per ref matters; a new push cancels the previous run in
# progress so the queue never backs up behind superseded commits.
concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The single Xcode that records AND verifies every snapshot reference. Snapshot rendering is
  # bound to the toolchain, so references are recorded on this exact version (record-snapshots.yaml
  # must match) and verified here. Bump this — and re-record — when the freshness check below warns
  # the runner offers a newer one. Version-independent logic and build jobs deliberately do NOT use
  # this; they run across the whole supported range.
  SNAPSHOT_XCODE: '26.6'

jobs:
  xcode-freshness:
    name: Xcode Freshness
    runs-on: macos-26
    steps:
      # Non-failing on purpose: a hard gate here would block an unrelated hotfix the day GitHub
      # bumps the runner's Xcode. The warning surfaces on the run summary instead.
      - name: Warn if the runner offers a newer Xcode than the snapshot pin
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed -nE 's|.*/Xcode_([0-9]+\.[0-9]+).*\.app|\1|p' | sort -V | tail -1)
          echo "snapshot pin: $SNAPSHOT_XCODE | newest on runner: ${latest:-none}"
          if [ -n "$latest" ] && [ "$latest" != "$SNAPSHOT_XCODE" ] \
             && [ "$(printf '%s\n%s\n' "$SNAPSHOT_XCODE" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "::warning title=Newer Xcode available::Snapshots are pinned to Xcode $SNAPSHOT_XCODE but the runner offers $latest — bump SNAPSHOT_XCODE in run-tests.yaml and record-snapshots.yaml, then re-record references."
          fi

  format-and-lint:
    name: Format and Lint
    runs-on: macos-26
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run lint
        run: mise run lint
    
  swift-build-matrix:
    name: Swift Test Matrix (${{ matrix.xcode }})
    needs: [format-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        xcode: ['16.3', '16.4', '26.0', '26.1', '26.2', '26.3']
        os: [macos-15]
        include:
          - xcode: '26.4'
            os: macos-26
          - xcode: '26.5'
            os: macos-26

    steps:
      - name: Select Xcode version (${{ matrix.xcode }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run focused unit suites
        run: |
          swift test --filter ExpectSnapshotAdapterTests
          swift test --filter ExpectSnapshotMacroTests
          swift test --filter SnapshotSuiteTests
          swift test --filter SnapshotTestTests
    
  ios-integration-tests:
    name: Integration Tests
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26

    steps:
      - name: Select Xcode version (${{ env.SNAPSHOT_XCODE }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.SNAPSHOT_XCODE }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Disable prebuilts
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          defaults read com.apple.dt.Xcode IDEPackageEnablePrebuilts

      - name: Run SnapshotsIntegrationTests (iOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsIntegrationTests \
            -destination "platform=iOS Simulator,name=iPhone 17"
    
  ios-integration-repetition-tests:
    name: Integration Repetition Tests
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26

    steps:
      - name: Select Xcode version (${{ env.SNAPSHOT_XCODE }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.SNAPSHOT_XCODE }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Disable prebuilts
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts -bool NO
          defaults read com.apple.dt.Xcode IDEPackageEnablePrebuilts

      - name: Run SnapshotsIntegrationRepetitionTests (iOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsIntegrationRepetitionTests \
            -destination "platform=iOS Simulator,name=iPhone 17"

  macos-unit-tests:
    name: Unit Tests
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26

    steps:
      - name: Select Xcode version (${{ env.SNAPSHOT_XCODE }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.SNAPSHOT_XCODE }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Run SnapshotsUnitTests (macOS)
        run: |
          xcodebuild test \
            -scheme SnapshotsUnitTests \
            -destination 'platform=macOS'

  native-consumer-build-checks:
    name: Native Consumer Build Checks (${{ matrix.xcode }} / ${{ matrix.scheme }} / ${{ matrix.platform.name }})
    needs: [format-and-lint, swift-build-matrix]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.4', '26.5']
        scheme: ['SnapshotsUnitTests', 'SnapshotsIntegrationTests']
        # Both platforms, in parallel. macOS alone compiles out everything behind
        # `#if canImport(UIKit)`, so an iOS-only break passes it unnoticed; iOS alone
        # never exercises the AppKit rendering path. Neither is a substitute.
        platform:
          - name: macOS
            destination: 'platform=macOS'
          - name: iOS
            destination: 'platform=iOS Simulator,name=iPhone 17'

    steps:
      - name: Select Xcode version (${{ matrix.xcode }})
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run native consumer build check (${{ matrix.platform.name }})
        run: |
          xcodebuild build-for-testing \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.platform.destination }}'
